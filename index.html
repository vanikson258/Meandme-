/* ============================================================
   РЕНДЕР И НАВИГАЦИЯ
   ============================================================ */
const TITLES = { home:"Я с собой", wizard:"Протокол", diary:"Дневник", entry:"Запись", tools:"Практики", tool:"", progress:"Прогресс", settings:"Настройки", daily:"Как прошёл день", support:"Карточка поддержки", chain:"Цепочка" };
let lastRenderKey = "";
const scrollMem = {};   // где человек остановился на каждом экране
function render(){
  clearTimers(); breathState = null;
  const key = view.name + "|" + (view.param || "") + "|" + stepIdx;
  // запоминаем позицию экрана, который сейчас уходит
  if(lastRenderKey) scrollMem[lastRenderKey] = window.scrollY;
  const root = document.getElementById("root");

  // первый запуск — знакомство, без шапки и меню
  if(!DB.settings.onboarded){
    document.getElementById("topbar").hidden = true;
    document.getElementById("navbar").hidden = true;
    root.innerHTML = screenOnboarding();
    window.scrollTo(0,0);
    lastRenderKey = "onboarding";
    return;
  }
  document.getElementById("topbar").hidden = false;
  document.getElementById("navbar").hidden = false;

  let html = "";
  if(view.name === "home") html = screenHome();
  else if(view.name === "wizard") html = screenWizard();
  else if(view.name === "diary") html = screenDiary();
  else if(view.name === "entry") html = screenEntry(view.param);
  else if(view.name === "tools") html = screenTools();
  else if(view.name === "tool") html = screenTool(view.param);
  else if(view.name === "progress") html = screenProgress();
  else if(view.name === "settings") html = screenSettings();
  else if(view.name === "daily") html = screenDaily();
  else if(view.name === "support") html = screenSupport();
  else if(view.name === "chain") html = screenChain();
  root.innerHTML = html;

  const tool = TOOLS.find(t=>t.id===view.param);
  const isRoot = ["home","diary","tools","progress"].indexOf(view.name) >= 0;
  document.getElementById("screenTitle").textContent = view.name==="tool" && tool ? tool.t : TITLES[view.name];
  // В Telegram роль «назад» берёт системная кнопка, своя тогда не нужна.
  document.getElementById("backBtn").hidden = isRoot || !!(TG && TG.BackButton);
  document.getElementById("settingsBtn").hidden = view.name === "settings";
  document.querySelectorAll(".nav button").forEach(b=>{
    if(b.dataset.tab === view.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  // возвращаемся туда же, где были на этом экране в прошлый раз
  window.scrollTo(0, scrollMem[key] || 0);
  lastRenderKey = key;
  if(view.name === "tool" && view.param === "urge") wireUrgeTimer();
  syncTG();
}

/* ---------- TELEGRAM ---------- */
function haptic(kind){
  if(!TG || !TG.HapticFeedback) return;
  try{
    if(kind === "select") TG.HapticFeedback.selectionChanged();
    else TG.HapticFeedback.impactOccurred(kind || "light");
  }catch(e){}
}
function syncTG(){
  if(!TG) return;
  const isRoot = ["home","diary","tools","progress"].indexOf(view.name) >= 0;
  try{
    if(TG.BackButton){ if(isRoot) TG.BackButton.hide(); else TG.BackButton.show(); }
    // Telegram спросит подтверждение при закрытии, только если в протоколе есть несохранённое.
    if(TG.enableClosingConfirmation){
      if(view.name === "wizard" && dirty) TG.enableClosingConfirmation();
      else TG.disableClosingConfirmation();
    }
  }catch(e){}
}
function applyTGTheme(){
  if(!TG) return;
  try{
    const dark = TG.colorScheme === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const ground = dark ? "#0A131C" : "#E9EFF5";
    if(TG.setHeaderColor) TG.setHeaderColor(ground);
    if(TG.setBackgroundColor) TG.setBackgroundColor(ground);
    if(TG.setBottomBarColor) TG.setBottomBarColor(ground);
  }catch(e){}
}
function initTelegram(){
  if(!TG) return;
  try{
    TG.ready();
    TG.expand();
    // иначе свайп вниз по странице закрывает приложение прямо посреди протокола
    if(TG.disableVerticalSwipes) TG.disableVerticalSwipes();
    if(TG.BackButton) TG.BackButton.onClick(back);
    applyTGTheme();
    TG.onEvent("themeChanged", applyTGTheme);
  }catch(e){}
}
function go(name, param){
  if(name !== "daily") dayDraft = null;
  if(name !== "chain") chainDraft = null;
  view.name = name; view.param = param || null;
  if(["home","diary","tools","progress"].indexOf(name) >= 0) view.tab = name;
  else if(name === "wizard" || name === "entry") view.tab = name === "entry" ? "diary" : "home";
  else if(name === "tool") view.tab = "tools";
  else if(name === "daily" || name === "chain") view.tab = "diary";
  render();
}
function leaveWizard(then){
  if(!dirty){ draft = null; dirty = false; return then(); }
  modal({ title:"Выйти из протокола?", text:"Заполненное не сохранится.", okLabel:"Выйти", danger:true,
    onOk:()=>{ draft = null; dirty = false; then(); } });
}
function back(){
  if(view.name === "wizard") return leaveWizard(()=>go("home"));
  if(view.name === "entry") return go("diary");
  if(view.name === "tool") return go("tools");
  if(view.name === "daily" || view.name === "chain") return go("diary");
  if(view.name === "support") return go("home");
  if(view.name === "settings") return go(view.tab);
  go("home");
}

/* ---------- МАСТЕР: ЛОГИКА ---------- */
function newDraft(){
  return { id:uid(), createdAt:Date.now(), intensityBefore:5, intensityAfter:5,
    b1:{ triggerTags:[], thoughtTags:[], distortions:[], feelings:[], fears:[], urges:[] },
    b2:{ pauseDone:[], zones:[], sensations:[], bodyPractices:[], prayerDone:[], returns:[] },
    b3:{ bodyAfter:[], feelings:[], chosen:[], kindSelf:[], kindOthers:[] } };
}
function startWizard(){
  draft = newDraft(); dirty = false; stepIdx = 0;
  // новый протокол начинается с чистого листа, а не там, где закончился прошлый
  Object.keys(scrollMem).forEach(k => { if(k.indexOf("wizard|") === 0) delete scrollMem[k]; });
  go("wizard");
}
function wizNext(){
  const steps = visibleSteps();
  if(stepIdx < steps.length-1){ stepIdx++; render(); return; }
  const entry = JSON.parse(JSON.stringify(draft));
  entry.updatedAt = Date.now();
  DB.entries.unshift(entry); save();
  draft = null; dirty = false;
  toast("Запись сохранена");
  go("entry", entry.id);
}

/* ---------- ТАЙМЕР СЕРФИНГА ---------- */
function wireUrgeTimer(){
  const btn = document.getElementById("uStart"), out = document.getElementById("uCount");
  if(!btn) return;
  let left = 20*60, running = false, iv = null;
  const paint = ()=>{ out.textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0"); };
  btn.addEventListener("click", ()=>{
    if(running){ clearInterval(iv); running = false; btn.textContent = "Продолжить"; return; }
    running = true; btn.textContent = "Пауза";
    iv = setInterval(()=>{
      left--; paint();
      if(left <= 0){ clearInterval(iv); running = false; btn.textContent = "Начать заново"; left = 20*60;
        out.textContent = "Волна прошла"; }
    }, 1000);
    timers.push(iv);
  });
}

/* ---------- ЭКСПОРТ / ИМПОРТ ---------- */
function entryToText(e){
  const L = [];
  const add = (k,v)=>{ if(v==null) return; if(Array.isArray(v)){ if(!v.length) return; v = v.join(", "); } v = String(v).trim(); if(v) L.push(k + ": " + v); };
  L.push("ПРОТОКОЛ САМОРЕГУЛЯЦИИ — " + fmtDate(e.createdAt));
  L.push("Накал: " + e.intensityBefore + " → " + e.intensityAfter); L.push("");
  L.push("БЛОК 1. АВТОМАТИЧЕСКАЯ РЕАКЦИЯ");
  add("1.1 Ситуация", get(e,"b1.trigger")); add("Что зацепило", get(e,"b1.triggerTags"));
  add("1.2 Мысли", get(e,"b1.thoughts")); add("Искажения", get(e,"b1.distortions"));
  add("1.3 Чувства", get(e,"b1.feelings")); add("Под ними", get(e,"b1.primaryRoot"));
  add("1.4 Боюсь потерять", (get(e,"b1.fears")||[]).concat(get(e,"b1.fearText")?[get(e,"b1.fearText")]:[]));
  add("1.5 Импульс", (get(e,"b1.urges")||[]).concat(get(e,"b1.urgeText")?[get(e,"b1.urgeText")]:[]));
  add("Чем обезболивает", get(e,"b1.relief"));
  L.push(""); L.push("БЛОК 2. ВЫХОД В НОВУЮ РЕАКЦИЮ");
  add("2.1 Пауза", get(e,"b2.pauseDone")); add("2.2 Признание боли", get(e,"b2.acceptText"));
  add("2.3 Тело", (get(e,"b2.zones")||[]).concat(get(e,"b2.sensations")||[]));
  add("2.4 Ребёнку", get(e,"b2.childText")); add("2.5 Молитва", get(e,"b2.prayerDone"));
  add("2.6 Возвращение к жизни", get(e,"b2.returns"));
  add("2.7 Факты", get(e,"b2.facts")); add("2.7 Интерпретация", get(e,"b2.interpretation")); add("2.7 Реальные причины", get(e,"b2.realCauses"));
  L.push(""); L.push("БЛОК 3. ПРОВЕРКА");
  add("2.8 Тело после", (get(e,"b3.bodyAfter")||[]).concat(get(e,"b3.bodyAfterText")?[get(e,"b3.bodyAfterText")]:[]));
  add("2.9 Чувства сейчас", get(e,"b3.feelings")); add("2.10 Мысли", get(e,"b3.thoughtsAfter"));
  add("2.11 Новое действие", get(e,"b3.newAction"));
  add("2.12 Было действие из автоматической реакции", get(e,"b3.acted")==="yes"?"да":get(e,"b3.acted")==="no"?"нет":null);
  add("Ущерб", get(e,"b3.harm")); add("Извинение", get(e,"b3.apology"));
  add("2.13 Доброе себе", (get(e,"b3.kindSelf")||[]).concat(get(e,"b3.kindText")?[get(e,"b3.kindText")]:[]));
  add("Доброе другим", get(e,"b3.kindOthers"));
  return L.join("\n");
}
function doImport(raw){
  if(!raw || !raw.trim()) return;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.entries)) throw new Error("bad");
    const ids = new Set(DB.entries.map(e=>e.id));
    const added = parsed.entries.filter(e=> e && e.id && !e.isExample && !ids.has(e.id));
    DB.entries = DB.entries.concat(added).sort((a,b)=> b.createdAt - a.createdAt);
    if(parsed.settings) DB.settings = Object.assign({}, DB.settings, parsed.settings);
    save(); toast("Восстановлено записей: " + added.length); render();
  }catch(err){ toast("Не получилось прочитать копию"); }
}
async function copyText(txt, okMsg){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast(okMsg); return; }
    throw new Error("no clipboard");
  }catch(err){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(okMsg); }
    catch(e2){ toast("Не удалось скопировать"); }
    ta.remove();
  }
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.addEventListener("click", (ev)=>{
  const t = ev.target.closest(
    "[data-chips],[data-radio],[data-go],[data-tab],[data-entry],[data-tool],[data-wiz],[data-flip]," +
    "[data-breath],[data-set],[data-copy],[data-del],[data-export],[data-import],[data-wipe]," +
    "[data-addanchor],[data-rmanchor],[data-addreturn],[data-rmreturn]," +
    "[data-day],[data-dtab],[data-emo],[data-dchips],[data-dset],[data-dsave],[data-ddel]," +
    "[data-supadd],[data-suprm],[data-askbuild],[data-askcopy]," +
    "[data-onbg],[data-onbp],[data-onbdone],[data-onbskip],[data-onbagain],[data-prayerreset]," +
    "[data-hd],[data-hadd],[data-hrm],[data-rel],[data-lb],[data-stq],[data-shq]," +
    "[data-nsc],[data-nadd],[data-nrm]," +
    "[data-chain],[data-ck],[data-cladd],[data-clrm],[data-cchips],[data-cweak],[data-csave],[data-cdel]," +
    "#bStart,#backBtn,#settingsBtn");
  if(!t) return;

  if(t.id === "backBtn") return back();
  if(t.id === "settingsBtn") return go("settings");

  /* ---- знакомство ---- */
  if(t.dataset.onbg){
    DB.settings.gender = t.dataset.onbg;
    haptic("select");
    document.querySelectorAll("[data-onbg]").forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.onbg === t.dataset.onbg)));
    const prev = document.getElementById("onbPreview");
    if(prev) prev.textContent = T.anchor;   // фраза сразу меняется — видно, на что влияет выбор
    return;
  }
  if(t.dataset.onbp !== undefined && t.hasAttribute("data-onbp")){
    DB.settings.prayer = t.dataset.onbp === "1";
    haptic("select");
    document.querySelectorAll("[data-onbp]").forEach(b=>
      b.setAttribute("aria-pressed", String((b.dataset.onbp === "1") === DB.settings.prayer)));
    return;
  }
  if(t.hasAttribute("data-prayerreset")){
    DB.settings.prayerText = ""; DB.settings.prayerShortText = "";
    save(); toast("Вернул исходный текст"); render(); return;
  }
  if(t.hasAttribute("data-onbdone") || t.hasAttribute("data-onbskip")){
    if(t.hasAttribute("data-onbdone")){
      const nm = document.getElementById("onb-name");
      const ag = document.getElementById("onb-age");
      DB.settings.name = (nm.value || "").trim().slice(0, 40);
      const a = parseInt(ag.value, 10);
      DB.settings.age = (a >= 5 && a <= 120) ? a : "";
    }
    DB.settings.onboarded = true;
    save(); flushSave(); haptic("light");
    go("home"); return;
  }
  if(t.hasAttribute("data-onbagain")){
    DB.settings.onboarded = false; save(); render(); return;
  }

  if(t.dataset.tab){
    const tab = t.dataset.tab;
    if(view.name === "wizard") return leaveWizard(()=>go(tab));
    return go(tab);
  }
  if(t.dataset.go === "wizard") return startWizard();
  if(t.dataset.go === "support") return go("support");
  if(t.dataset.entry) return go("entry", t.dataset.entry);
  if(t.dataset.tool) return go("tool", t.dataset.tool);
  if(t.dataset.day) return go("daily", t.dataset.day);
  if(t.dataset.dtab){ diaryTab = t.dataset.dtab; return render(); }

  /* ---- карточка дня ---- */
  if(t.dataset.emo){
    if(!dayDraft) return;
    const k = t.dataset.emo, v = +t.dataset.val;
    if(dayDraft.emotions[k] === v) delete dayDraft.emotions[k];   // повторное нажатие снимает отметку
    else dayDraft.emotions[k] = v;
    haptic("select");
    t.parentElement.querySelectorAll("[data-emo]").forEach(b=>
      b.setAttribute("aria-pressed", String(+b.dataset.val === dayDraft.emotions[k])));
    return;
  }
  if(t.dataset.dchips){
    if(!dayDraft) return;
    const arr = toggleIn(dayDraft, t.dataset.dchips, t.dataset.val);
    haptic("select");
    t.setAttribute("aria-pressed", String(arr.indexOf(t.dataset.val) >= 0));
    // блок «и что с ними было» появляется только когда отмечен хоть один импульс
    if(t.dataset.dchips === "urges" && (arr.length === 0 || arr.length === 1)) render();
    return;
  }
  if(t.dataset.dset === "acted"){
    if(!dayDraft) return;
    dayDraft.acted = (dayDraft.acted === t.dataset.val) ? "" : t.dataset.val;
    haptic("select");
    document.querySelectorAll('[data-dset="acted"]').forEach(b=>
      b.setAttribute("aria-pressed", String(b.dataset.val === dayDraft.acted)));
    return;
  }
  if(t.dataset.dsave){
    if(!dayDraft) return;
    DB.days[t.dataset.dsave] = JSON.parse(JSON.stringify(dayDraft));
    save(); flushSave();
    toast("День сохранён"); dayDraft = null; diaryTab = "days"; go("diary"); return;
  }
  if(t.dataset.ddel){
    const k = t.dataset.ddel;
    modal({ title:"Удалить отметку за день?", okLabel:"Удалить", danger:true,
      onOk:()=>{ delete DB.days[k]; save(); dayDraft = null; diaryTab = "days"; toast("Отметка удалена"); go("diary"); } });
    return;
  }

  /* ---- отношения ---- */
  if(t.dataset.hd !== undefined && t.hasAttribute("data-hd")){
    relDraftD = (relDraftD === +t.dataset.hd) ? null : +t.dataset.hd;
    haptic("select");
    document.querySelectorAll("[data-hd]").forEach(b=> b.setAttribute("aria-pressed", String(+b.dataset.hd === relDraftD)));
    return;
  }
  if(t.hasAttribute("data-hadd")){
    const inp = document.getElementById("h-text"), v = (inp.value||"").trim();
    if(!v){ toast("Опиши ситуацию"); return; }
    if(relDraftD == null){ toast("Оцени сложность от 1 до 10"); return; }
    DB.rel.hierarchy.push({ t:v, d:relDraftD });
    relDraftD = null; save(); render(); return;
  }
  if(t.dataset.hrm !== undefined && t.hasAttribute("data-hrm")){ DB.rel.hierarchy.splice(+t.dataset.hrm,1); save(); render(); return; }
  if(t.dataset.rel){
    const f = t.dataset.rel, v = +t.dataset.val;
    DB.rel[f] = (DB.rel[f] === v) ? null : v;
    save(); haptic("select"); render(); return;
  }
  if(t.dataset.lb){
    toggleIn(DB.rel, "listenBlocks", t.dataset.lb);
    save(); haptic("select");
    t.setAttribute("aria-pressed", String((DB.rel.listenBlocks||[]).indexOf(t.dataset.lb) >= 0));
    return;
  }
  if(t.dataset.stq !== undefined && t.hasAttribute("data-stq")){
    toggleIn(DB.rel, "styleAnswers", +t.dataset.stq);
    save(); haptic("select"); render(); return;
  }
  if(t.dataset.shq !== undefined && t.hasAttribute("data-shq")){
    toggleIn(DB.rel, "shouldAnswers", +t.dataset.shq);
    save(); haptic("select"); render(); return;
  }
  if(t.dataset.nsc){
    const f = t.dataset.nsc, v = +t.dataset.val;
    if(f === "mine") relDraftMine = (relDraftMine === v) ? null : v;
    else relDraftTheirs = (relDraftTheirs === v) ? null : v;
    haptic("select");
    document.querySelectorAll('[data-nsc="' + f + '"]').forEach(b=>
      b.setAttribute("aria-pressed", String(+b.dataset.val === (f === "mine" ? relDraftMine : relDraftTheirs))));
    return;
  }
  if(t.hasAttribute("data-nadd")){
    const who = (document.getElementById("n-who").value||"").trim();
    if(!who){ toast("Укажи, с кем эти отношения"); return; }
    if(relDraftMine == null || relDraftTheirs == null){ toast("Отметь обе шкалы"); return; }
    DB.rel.needs.push({ who, mine:relDraftMine, theirs:relDraftTheirs });
    relDraftMine = relDraftTheirs = null; save(); render(); return;
  }
  if(t.dataset.nrm !== undefined && t.hasAttribute("data-nrm")){ DB.rel.needs.splice(+t.dataset.nrm,1); save(); render(); return; }

  /* ---- поведенческий анализ ---- */
  if(t.dataset.chain !== undefined && t.hasAttribute("data-chain")){
    chainDraft = null; return go("chain", t.dataset.chain || null);
  }
  if(t.dataset.ck){
    chainKind = t.dataset.ck; haptic("select");
    document.querySelectorAll("[data-ck]").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.ck === chainKind)));
    return;
  }
  if(t.hasAttribute("data-cladd")){
    if(!chainDraft) return;
    const inp = document.getElementById("c-link"), v = (inp.value||"").trim();
    if(!v){ toast("Напиши, что было дальше"); return; }
    chainDraft.links.push({ kind:chainKind, text:v });
    render(); return;
  }
  if(t.dataset.clrm !== undefined && t.hasAttribute("data-clrm")){
    if(!chainDraft) return;
    const i = +t.dataset.clrm;
    chainDraft.links.splice(i,1);
    if(chainDraft.weakIdx === i) chainDraft.weakIdx = null;
    else if(chainDraft.weakIdx > i) chainDraft.weakIdx--;
    render(); return;
  }
  if(t.dataset.cchips){
    if(!chainDraft) return;
    const arr = toggleIn(chainDraft, t.dataset.cchips, t.dataset.val);
    haptic("select");
    t.setAttribute("aria-pressed", String(arr.indexOf(t.dataset.val) >= 0));
    return;
  }
  if(t.dataset.cweak !== undefined && t.hasAttribute("data-cweak")){
    if(!chainDraft) return;
    const i = +t.dataset.cweak;
    chainDraft.weakIdx = (chainDraft.weakIdx === i) ? null : i;
    haptic("select");
    document.querySelectorAll("[data-cweak]").forEach(b=>
      b.setAttribute("aria-pressed", String(+b.dataset.cweak === chainDraft.weakIdx)));
    return;
  }
  if(t.hasAttribute("data-csave")){
    if(!chainDraft) return;
    if(!(chainDraft.target||"").trim() && !chainDraft.links.length){ toast("Заполни хотя бы то, что разбираешь"); return; }
    chainDraft.updatedAt = Date.now();
    const i = DB.chains.findIndex(x => x.id === chainDraft.id);
    if(i >= 0) DB.chains[i] = JSON.parse(JSON.stringify(chainDraft));
    else DB.chains.unshift(JSON.parse(JSON.stringify(chainDraft)));
    save(); flushSave();
    chainDraft = null; diaryTab = "chains";
    toast("Разбор сохранён"); go("diary"); return;
  }
  if(t.dataset.cdel){
    const id = t.dataset.cdel;
    modal({ title:"Удалить разбор?", text:"Восстановить его будет нельзя.", okLabel:"Удалить", danger:true,
      onOk:()=>{ DB.chains = DB.chains.filter(x=>x.id!==id); save(); chainDraft = null; diaryTab = "chains"; toast("Разбор удалён"); go("diary"); } });
    return;
  }

  /* ---- карточка поддержки ---- */
  if(t.dataset.supadd){
    const f = t.dataset.supadd, inp = document.getElementById("sup-" + f);
    const v = (inp.value || "").trim();
    if(v){ DB.support[f].push(v); save(); render(); }
    return;
  }
  if(t.dataset.suprm){ DB.support[t.dataset.suprm].splice(+t.dataset.i, 1); save(); render(); return; }

  /* ---- конструктор просьбы ---- */
  if(t.hasAttribute("data-askbuild")){
    const v = (id)=> (document.getElementById("ask-" + id).value || "").trim();
    const facts = v("facts"), feel = v("feel"), req = v("req"), gain = v("gain"), self = v("self");
    if(!facts && !req){ toast("Заполни хотя бы факты и просьбу"); return; }
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/\s*[.。]?\s*$/, "") + ".";
    const parts = [];
    if(facts) parts.push(cap(facts));
    if(feel) parts.push(cap(feel));
    if(req) parts.push("Я прошу: " + req.replace(/^\s*[А-ЯA-Z]/, c=>c.toLowerCase()).replace(/\s*[.。]?\s*$/, "") + ".");
    if(gain) parts.push(cap(gain));
    if(self) parts.push(cap(self));
    const out = document.getElementById("askOut");
    document.getElementById("askText").textContent = parts.join(" ");
    out.hidden = false;
    haptic("light");
    return;
  }
  if(t.hasAttribute("data-askcopy")){
    copyText(document.getElementById("askText").textContent, "Скопировано");
    return;
  }

  if(t.hasAttribute("data-flip")){
    const box = t.closest(".flip"), body = box.querySelector(".flip-body");
    const open = box.dataset.open === "1";
    box.dataset.open = open ? "0" : "1"; body.hidden = open; return;
  }
  if(t.dataset.breath !== undefined && t.dataset.breath){
    t.parentElement.querySelectorAll("[data-breath]").forEach(b=> b.setAttribute("aria-pressed", String(b===t)));
    if(breathState) startBreath(t.dataset.breath);
    return;
  }
  if(t.id === "bStart"){
    if(breathState) stopBreath();
    else { const m = document.querySelector('[data-breath][aria-pressed="true"]'); startBreath(m ? m.dataset.breath : "4-6"); }
    return;
  }
  if(t.dataset.chips){
    if(!draft) return;
    const arr = toggleIn(draft, t.dataset.chips, t.dataset.val);
    dirty = true; haptic("select");
    // Меняем только нажатую кнопку — иначе страница перерисуется и прокрутка уедет наверх.
    t.setAttribute("aria-pressed", String(arr.indexOf(t.dataset.val) >= 0));
    // Исключение: выбор чувства может открыть или убрать вопрос о первичном чувстве.
    if(t.dataset.chips === "b1.feelings" || t.dataset.chips === "b3.feelings"){
      if(feelingBlockChanged(t.dataset.chips)) render();
    }
    return;
  }
  if(t.dataset.radio){
    if(!draft) return;
    const path = t.dataset.radio;
    const cur = get(draft, path);
    const next = cur === t.dataset.val ? "" : t.dataset.val;
    set(draft, path, next);
    dirty = true; haptic("select");
    // 2.12 меняет набор полей целиком — только здесь нужна перерисовка.
    if(path === "b3.acted"){ render(); return; }
    document.querySelectorAll("[data-radio]").forEach(b=>{
      if(b.dataset.radio === path) b.setAttribute("aria-pressed", String(b.dataset.val === next));
    });
    return;
  }
  if(t.dataset.wiz === "next"){ haptic("light"); return wizNext(); }
  if(t.dataset.wiz === "prev"){ if(stepIdx>0){ stepIdx--; render(); } return; }
  if(t.dataset.wiz === "cancel") return leaveWizard(()=>go("home"));

  if(t.dataset.set === "gender"){ DB.settings.gender = t.dataset.val; save(); render(); return; }
  if(t.dataset.set === "prayer"){ DB.settings.prayer = !DB.settings.prayer; save(); render(); return; }
  if(t.hasAttribute("data-addanchor")){
    const inp = document.getElementById("newAnchor"); const v = inp.value.trim();
    if(v){ DB.settings.anchors.push(v); save(); render(); } return;
  }
  if(t.dataset.rmanchor !== undefined && t.hasAttribute("data-rmanchor")){ DB.settings.anchors.splice(+t.dataset.rmanchor,1); save(); render(); return; }
  if(t.hasAttribute("data-addreturn")){
    const inp = document.getElementById("newReturn"); const v = inp.value.trim();
    if(v){ DB.settings.returns.push(v); save(); render(); } return;
  }
  if(t.dataset.rmreturn !== undefined && t.hasAttribute("data-rmreturn")){ DB.settings.returns.splice(+t.dataset.rmreturn,1); save(); render(); return; }

  if(t.dataset.copy){
    const e = DB.entries.find(x=>x.id===t.dataset.copy);
    if(e) copyText(entryToText(e), "Запись скопирована"); return;
  }
  if(t.dataset.del){
    const id = t.dataset.del;
    modal({ title:"Удалить запись?", text:"Восстановить её будет нельзя.", okLabel:"Удалить", danger:true,
      onOk:()=>{ DB.entries = DB.entries.filter(x=>x.id!==id); save(); toast("Запись удалена"); go("diary"); } });
    return;
  }
  if(t.hasAttribute("data-export")){ copyText(JSON.stringify(DB), "Копия в буфере обмена — сохрани её себе"); return; }
  if(t.hasAttribute("data-import")){
    modal({ title:"Восстановить из копии", text:"Вставь текст резервной копии. Существующие записи не пропадут — добавятся только те, которых ещё нет.",
      input:true, placeholder:"Вставь сюда скопированный текст", okLabel:"Восстановить", onOk:doImport });
    return;
  }
  if(t.hasAttribute("data-wipe")){
    modal({ title:"Удалить все записи?", text:"Весь дневник будет стёрт без возможности восстановить. Если не уверен(а) — сначала скопируй резервную копию.",
      okLabel:"Удалить всё", danger:true,
      onOk:()=>{ DB.entries = []; save(); toast("Все записи удалены"); render(); } });
    return;
  }
});

document.addEventListener("input", (ev)=>{
  const el = ev.target;
  if(el.dataset && el.dataset.f && draft){
    set(draft, el.dataset.f, el.value);
    if(!dirty){ dirty = true; syncTG(); }   // ввод не перерисовывает экран, поэтому вручную
    return;
  }
  if(el.dataset && el.dataset.range && draft){
    const v = +el.value;
    set(draft, el.dataset.range, v);
    if(!dirty){ dirty = true; syncTG(); }
    const wrap = el.closest(".lg-slider");
    if(wrap) wrap.style.setProperty("--p", v/10);
    const b = el.closest(".stack-s").querySelector(".slider-val");
    if(b) b.textContent = v;
    return;
  }
  if(el.dataset && el.dataset.setinput){ DB.settings[el.dataset.setinput] = el.value; save(); return; }
  if(el.hasAttribute("data-dnote") && dayDraft){ dayDraft.note = el.value; return; }
  if(el.dataset && el.dataset.cf && chainDraft){ chainDraft[el.dataset.cf] = el.value; return; }
  if(el.hasAttribute("data-supreasons")){ DB.support.reasons = el.value; save(); return; }
});

window.addEventListener("scroll", ()=>{
  const tb = document.getElementById("topbar");
  if(window.scrollY > 6) tb.classList.add("scrolled"); else tb.classList.remove("scrolled");
}, {passive:true});

/* ---------- СТАРТ ---------- */
(async function init(){
  initTelegram();
  const loaded = await Adapter.load();
  if(loaded){
    DB = Object.assign({}, DEFAULTS, loaded);
    DB.settings = Object.assign({}, DEFAULTS.settings, loaded.settings||{});
    DB.entries = Array.isArray(loaded.entries) ? loaded.entries : [];
    DB.days = (loaded.days && typeof loaded.days === "object") ? loaded.days : {};
    DB.support = Object.assign({}, DEFAULTS.support, loaded.support||{});
    DB.chains = Array.isArray(loaded.chains) ? loaded.chains : [];
    DB.rel = Object.assign({}, DEFAULTS.rel, loaded.rel||{});
    // у тех, кто уже пользовался приложением, знакомство не всплывает задним числом
    if(loaded.settings && loaded.settings.onboarded === undefined) DB.settings.onboarded = true;
  }
  // Убираем демонстрационную запись, если она осталась от предыдущей версии.
  const n = DB.entries.length;
  DB.entries = DB.entries.filter(e => e && !e.isExample);
  if(DB.entries.length !== n) save();
  render();
})();
</script>
